services:
  haruvo:
    build:
      context: ..
    image: ${HARUVO_IMAGE:-haruvo:local}
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      HARUVO_ENV: production
      HARUVO_BIND: 0.0.0.0
      HARUVO_PORT: 8080
      # Used in the one-time Initial setup URL printed to stderr on a fresh database.
      HARUVO_PUBLIC_ORIGIN: ${HARUVO_PUBLIC_ORIGIN:-http://localhost:8080}
      # Stock path. If this file is missing and an older statixo.sqlite or
      # status.sqlite is visible (this directory, /var/lib/statixo, or /var/lib/haruvo),
      # that file is kept. To keep a volume mounted elsewhere, set this to that file.
      # STATIXO_DATABASE_PATH and STATUS_DATABASE_PATH apply when this name is unset.
      HARUVO_DATABASE_PATH: /var/lib/haruvo/haruvo.sqlite
      # Public sign-up stays closed after the owner is created from that URL.
      # The root user opens it in Settings after SMTP is configured.
      # Switch the same binary to Postgres by setting this and starting the db service.
      # HARUVO_DB_PASSWORD comes from the environment. Do not commit a password.
      # HARUVO_DATABASE_URL: postgres://haruvo:${HARUVO_DB_PASSWORD}@db:5432/haruvo
    volumes:
      - haruvo-data:/var/lib/haruvo
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: haruvo
  #     POSTGRES_PASSWORD: ${HARUVO_DB_PASSWORD}
  #     POSTGRES_DB: haruvo
  #   volumes:
  #     - haruvo-pg:/var/lib/postgresql/data
volumes:
  haruvo-data:
  # haruvo-pg:
