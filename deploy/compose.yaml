services:
  haruvo:
    build:
      context: ..
    image: ${HARUVO_IMAGE:-haruvo:local}
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      HARUVO_ENV: production
      HARUVO_BIND: 0.0.0.0
      HARUVO_PORT: 8080
      # Used in the one-time Initial setup URL printed to stderr on a fresh database.
      HARUVO_PUBLIC_ORIGIN: ${HARUVO_PUBLIC_ORIGIN:-http://localhost:8080}
      HARUVO_DATABASE_PATH: /var/lib/haruvo/haruvo.sqlite
      # Public sign-up stays closed after the owner is created from that URL.
      # The root user opens it in Settings after SMTP is configured.
      # Switch the same binary to Postgres by setting this and starting the db service.
      # HARUVO_DATABASE_URL: postgres://haruvo:haruvo@db:5432/haruvo
    volumes:
      - haruvo-data:/var/lib/haruvo
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: haruvo
  #     POSTGRES_PASSWORD: haruvo
  #     POSTGRES_DB: haruvo
  #   volumes:
  #     - haruvo-pg:/var/lib/postgresql/data
volumes:
  haruvo-data:
  # haruvo-pg:
