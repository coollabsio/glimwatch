services:
  owlee:
    build:
      context: ..
    image: ${OWLEE_IMAGE:-owlee:local}
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      OWLEE_ENV: production
      OWLEE_BIND: 0.0.0.0
      OWLEE_PORT: 8080
      # Used in the one-time Initial setup URL printed to stderr on a fresh database.
      OWLEE_PUBLIC_ORIGIN: ${OWLEE_PUBLIC_ORIGIN:-http://localhost:8080}
      # SQLite file inside the volume. Set this to another path to use a different file.
      OWLEE_DATABASE_PATH: /var/lib/owlee/owlee.sqlite
      # Public sign-up stays closed after the owner is created from that URL.
      # The root user opens it in Settings after SMTP is configured.
      # Switch the same binary to Postgres by setting this and starting the db service.
      # OWLEE_DB_PASSWORD comes from the environment. Do not commit a password.
      # OWLEE_DATABASE_URL: postgres://owlee:${OWLEE_DB_PASSWORD}@db:5432/owlee
    volumes:
      - owlee-data:/var/lib/owlee
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: owlee
  #     POSTGRES_PASSWORD: ${OWLEE_DB_PASSWORD}
  #     POSTGRES_DB: owlee
  #   volumes:
  #     - owlee-pg:/var/lib/postgresql/data
volumes:
  owlee-data:
  # owlee-pg:
