services:
  status:
    build:
      context: ..
    image: ${STATUS_IMAGE:-status:local}
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      STATUS_ENV: production
      STATUS_BIND: 0.0.0.0
      STATUS_PORT: 8080
      STATUS_PUBLIC_ORIGIN: ${STATUS_PUBLIC_ORIGIN:-http://localhost:8080}
      STATUS_DATABASE_PATH: /var/lib/status/status.sqlite
      # Switch the same binary to Postgres by setting this and starting the db service.
      # STATUS_DATABASE_URL: postgres://status:status@db:5432/status
    volumes:
      - status-data:/var/lib/status
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: status
  #     POSTGRES_PASSWORD: status
  #     POSTGRES_DB: status
  #   volumes:
  #     - status-pg:/var/lib/postgresql/data
volumes:
  status-data:
  # status-pg:
