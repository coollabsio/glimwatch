[package]
name = "haruvo-server"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "haruvo_server"
path = "src/lib.rs"

[[bin]]
name = "haruvo"
path = "src/main.rs"

[dependencies]
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
chrono.workspace = true
clap = { version = "4", features = ["derive", "env"] }
haruvo-domain = { path = "../../crates/status" }
haruvo-insights = { path = "../../crates/insights" }
haruvo-platform = { path = "../../crates/platform" }
isbot = "0.1.3"
maxminddb = "0.30.3"
http-body-util = "0.1"
include_dir = "0.7"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["mysql"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing.workspace = true
toml = "1.1.8"

[dev-dependencies]
haruvo-platform = { path = "../../crates/platform" }
http-body-util = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
