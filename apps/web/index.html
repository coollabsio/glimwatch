<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glimwatch</title>
    <meta
      name="description"
      content="Status pages, incidents, and uptime monitoring from coolLabs."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Applies the saved appearance (src/lib/theme.ts) before the first paint.
      (function () {
        var a = {};
        try { a = JSON.parse(localStorage.getItem("glimwatch-appearance")) || {}; } catch (e) {}
        var root = document.documentElement;
        var theme = a.theme || "dark";
        var vars = theme === "custom" ? a.vars : null;
        var dark;
        if (vars) {
          for (var name in vars) root.style.setProperty(name, vars[name]);
          dark = vars["--theme-light"] === "0";
        } else {
          dark = theme !== "light" && (theme !== "system" || matchMedia("(prefers-color-scheme: dark)").matches);
        }
        root.classList.toggle("dark", dark);
        root.dataset.theme = vars ? "custom" : dark ? "dark" : "light";
        root.dataset.navStyle = a.navStyle === "floating" ? "floating" : "default";
        root.dataset.navItems = a.navItems === "flat" ? "flat" : "3d";
        root.dataset.pageWidth = a.pageWidth === "full" ? "full" : "centered";
        var meta = document.createElement("meta");
        meta.setAttribute("name", "theme-color");
        meta.setAttribute("content", vars ? vars["--theme-bg"] : dark ? "#0a0a0a" : "#ffffff");
        document.head.appendChild(meta);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
