name: Container image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # buildx's type=gha cache exporter writes to the Actions cache.
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # The GitHub repository is coollabsio/glimwatch. This publishes
  # ghcr.io/<owner>/glimwatch.
  IMAGE: ghcr.io/${{ github.repository_owner }}/glimwatch

jobs:
  build-push:
    name: build (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve short SHA
        id: version
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.short_sha }}-${{ matrix.arch }}
            type=raw,value=main-${{ matrix.arch }},enable={{is_default_branch}}

      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          # Plain single-arch manifest. An attestation index makes the
          # imagetools merge below a nested index Coolify cannot pull.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  merge-manifest:
    name: merge manifest
    runs-on: ubuntu-24.04
    needs: build-push
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and publish multi-arch manifest
        env:
          IMAGE: ${{ env.IMAGE }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          # SHA-arch tags are the imagetools inputs. main-amd64 and
          # main-aarch64 are also pushed above, but a later run can move
          # those tags before this job reads them.
          args=(
            "${IMAGE}:${short}-amd64"
            "${IMAGE}:${short}-aarch64"
            --tag "${IMAGE}:${short}"
          )
          if [ "${GITHUB_REF_NAME}" = "${DEFAULT_BRANCH}" ]; then
            args+=(--tag "${IMAGE}:main" --tag "${IMAGE}:latest")
          fi
          docker buildx imagetools create "${args[@]}"

          docker buildx imagetools inspect "${IMAGE}:${short}"
          raw="$(docker buildx imagetools inspect --raw "${IMAGE}:${short}")"
          if ! printf '%s\n' "${raw}" | jq -e '
            (.manifests | length) == 2
            and (([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | length) == 1)
            and (([.manifests[] | select(.platform.os == "linux" and (.platform.architecture == "arm64" or .platform.architecture == "aarch64"))] | length) == 1)
            and (([.manifests[] | select(.platform.architecture == "unknown" or .annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length) == 0)
          ' >/dev/null; then
            printf '%s\n' "${raw}"
            echo "expected a plain linux/amd64 + linux/arm64 manifest list" >&2
            exit 1
          fi
